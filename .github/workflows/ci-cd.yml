name: Java CI/CD with EC2

on:
  push:
    branches: [ "main" ]

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      - name: Build JAR
        run: mvn clean package

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "target/demo.jar"
          target: "/home/ubuntu/"

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script_stop: false   # 🔥 IMPORTANT FIX
          script: |
            echo "Stopping old app..."
            pkill -f demo.jar || true

            sleep 2

            echo "Starting new app..."
            nohup java -jar /home/ubuntu/demo.jar > app.log 2>&1 &

            sleep 5

            echo "Checking app..."
            pgrep -f demo.jar && echo "✅ Running" || (echo "❌ Failed" && exit 1)

            echo "Done"
