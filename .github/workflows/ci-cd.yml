name: Java CI/CD with EC2

on:
  push:
    branches: [ "main" ]

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Setup Java
      - name: Setup JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      # 3. Build project
      - name: Build with Maven
        run: mvn clean package

      # 4. Copy JAR to EC2
      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "target/demo.jar"
          target: "/home/ubuntu/"

      # 5. Deploy safely on EC2
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            echo "========== DEPLOY START =========="

            echo "Stopping old app..."

            if [ -f /home/ubuntu/app.pid ]; then
              PID=$(cat /home/ubuntu/app.pid)
              echo "Killing process $PID"
              kill -15 $PID || true
              rm /home/ubuntu/app.pid
            else
              echo "No running app"
            fi

            sleep 2

            echo "Starting new app..."
            nohup java -jar /home/ubuntu/demo.jar > /home/ubuntu/app.log 2>&1 &

            echo $! > /home/ubuntu/app.pid

            sleep 5

            echo "Checking application status..."
            PID=$(cat /home/ubuntu/app.pid)
            if ps -p $PID > /dev/null
            then
              echo "✅ App started successfully (PID: $PID)"
            else
              echo "❌ App failed to start"
              exit 1
            fi

            echo "========== DEPLOY DONE =========="
